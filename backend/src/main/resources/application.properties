spring.application.name=job-tracker
server.port=${PORT:8080}

# ---- Login ----
# No defaults on purpose: the app refuses to start until these are set.
#  - Live (Render): environment variables APP_USERNAME / APP_PASSWORD
#  - Local: copy application-local.properties.example to
#           application-local.properties (git ignores that file)
app.username=${APP_USERNAME}
app.password=${APP_PASSWORD}
spring.config.import=optional:classpath:application-local.properties

# ---- Database ----
# Local: a file-based H2 database in ./data (no setup needed)
# Live:  set DB_URL / DB_USER / DB_PASSWORD to your Postgres (e.g. Neon)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/jobtracker;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=3

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.compression.enabled=true
server.error.include-message=always
